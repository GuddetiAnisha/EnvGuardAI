services:
  envguard:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
